# Collections group datasets for discovery. Optional `group` field enables UI grouping.
# All dataset_ids must exist in catalog/datasets.yaml.

collections:
  # --- Land & vegetation ---
  - id: land_cover
    name: Land cover
    group: land_environment
    datasets:
      - dynamic_world

  - id: vegetation
    name: Vegetation
    group: land_environment
    datasets:
      - modis_ndvi

  - id: forest
    name: Forest
    group: land_environment
    datasets:
      - hansen_forest_change
      - hansen_treecover2000

  # --- Water & flood ---
  - id: water
    name: Surface water
    group: water_flood
    datasets:
      - jrc_global_surface_water
      - jrc_global_surface_water_occurrence
      - jrc_global_surface_water_seasonality

  - id: hydrography
    name: Hydrography
    group: water_flood
    datasets:
      - merit_hydro
      - merit_hydro_elv
      - merit_hydro_upa

  - id: flood
    name: Flood
    group: water_flood
    datasets:
      - copernicus_emsn194

  # --- Built environment ---
  - id: buildings
    name: Buildings
    group: built_environment
    datasets:
      - ghsl_built_up

  - id: settlement
    name: Settlement / Urbanization
    group: built_environment
    datasets:
      - ghsl_degree_urbanization

  # --- Population & socioeconomics ---
  - id: population
    name: Population
    group: population_socio
    datasets:
      - ghsl_population

  - id: socioeconomics
    name: Socioeconomics
    group: population_socio
    datasets:
      - br_ibge

  # --- Infrastructure & energy ---
  - id: transport
    name: Transport
    group: infrastructure
    datasets:
      - poa_gtfs

  - id: solar
    name: Solar
    group: infrastructure
    datasets:
      - global_solar_atlas

  - id: night_lights
    name: Night lights
    group: infrastructure
    datasets:
      - noaa_viirs_nightlights

  - id: power_grid
    name: Power grid
    group: infrastructure
    datasets:
      - mapbiomas_power_infrastructure
      - mapbiomas_energy_infrastructure

  # --- Climate hazards ---
  - id: extreme_precipitation
    name: Extreme precipitation
    group: climate_hazards
    datasets:
      - chirps_r90p_2024
      - chirps_r90p_climatology
      - chirps_r95p_2024
      - chirps_r95p_climatology
      - chirps_r99p_2024
      - chirps_r99p_climatology
      - chirps_rx1day_2024
      - chirps_rx1day_climatology
      - chirps_rx5day_2024
      - chirps_rx5day_climatology

  - id: extreme_temperature
    name: Extreme temperature
    group: climate_hazards
    datasets:
      - era5land_tnx_2024
      - era5land_tnx_climatology
      - era5land_tx90p_2024
      - era5land_tx90p_climatology
      - era5land_tx99p_2024
      - era5land_tx99p_climatology
      - era5land_txx_2024
      - era5land_txx_climatology

  - id: heatwave
    name: Heatwave
    group: climate_hazards
    datasets:
      - era5land_hwm_2024
      - era5land_hwm_climatology
      - era5land_hwm_2030s_45
      - era5land_hwm_2030s_85
      - era5land_hwm_2050s_85
      - era5land_hwm_2100s_85

  - id: flood_risk_index
    name: Flood risk index
    group: climate_hazards
    datasets:
      - chirps_copdem_fri_2024
      - chirps_copdem_fri_2030s_ssp245
      - chirps_copdem_fri_2030s_ssp585
      - chirps_copdem_fri_2050s_ssp245
      - chirps_copdem_fri_2050s_ssp585
      - chirps_copdem_fri_2100s_ssp245
      - chirps_copdem_fri_2100s_ssp585

  # --- Terrain ---
  - id: elevation
    name: Elevation
    group: terrain
    datasets:
      - copernicus_dem
