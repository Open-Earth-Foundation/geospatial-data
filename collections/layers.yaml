layers:
  - layer_id: slope
    layer_name: Slope
    layer_type: derived_indicator
    analytical_level: 1
    category: terrain
    source_datasets:
      - dem_copernicus_30m
    dependencies: []
    output_format: cog
    description: Terrain slope derived from DEM.

  - layer_id: flow_accumulation
    layer_name: Flow Accumulation
    layer_type: derived_indicator
    analytical_level: 1
    category: hydrology
    source_datasets:
      - dem_copernicus_30m
    dependencies: []
    output_format: cog
    description: Upslope contributing area proxy derived from elevation.

  - layer_id: population_density
    layer_name: Population Density
    layer_type: derived_indicator
    analytical_level: 1
    category: exposure
    source_datasets:
      - worldpop_population
    dependencies: []
    output_format: cog
    description: Population density raster normalized for exposure scoring.

  - layer_id: building_density
    layer_name: Building Density
    layer_type: derived_indicator
    analytical_level: 1
    category: exposure
    source_datasets:
      - osm_building_footprints
    dependencies: []
    output_format: cog
    description: Built footprint density indicator.

  - layer_id: canopy_cover_pct
    layer_name: Canopy Cover Percentage
    layer_type: derived_indicator
    analytical_level: 1
    category: ecosystem
    source_datasets:
      - modis_ndvi
      - esa_worldcover_10m
    dependencies: []
    output_format: cog
    description: Vegetation canopy proxy used for cooling and ecosystem analysis.

  - layer_id: flood_hazard
    layer_name: Flood Hazard
    layer_type: hazard
    analytical_level: 2
    category: flood
    source_datasets:
      - jrc_gloflor_v2
      - global_flood_database
      - wri_aqueduct_flood
      - gfplain250m
    dependencies: []
    transformation_script: transformation/flood_hazard/
    model: models/flood_hazard/
    output_format: cog
    description: >
      Ensemble flood hazard screening index (0–1) from JRC GLOFLO depth (RP100),
      Global Flood Database event count, WRI Aqueduct fluvial hazard, and GFPLAIN250m
      on a common grid. Weights and methodology in models/flood_hazard/.

  - layer_id: heat_hazard
    layer_name: Heat Hazard
    layer_type: hazard
    analytical_level: 2
    category: heat
    source_datasets:
      - landsat8_lst_djf
      - modis_mod11a2_lst_djf
    dependencies: []
    transformation_script: transformation/heat_hazard/
    model: models/heat_hazard/
    output_format: cog
    description: >
      Ensemble heat hazard screening index (0–1) from Landsat 8 and MODIS MOD11A2
      LST percentiles (season configured per city). Optional ERA5-Land heatwave
      frequency may be enabled in site config. Methodology in models/heat_hazard/.

  - layer_id: exposure_score
    layer_name: Exposure Score
    layer_type: exposure
    analytical_level: 2
    category: exposure
    source_datasets: []
    dependencies:
      - population_density
      - building_density
    output_format: cog
    description: Combined exposure index for people and built assets.

  - layer_id: cooling_capacity
    layer_name: Cooling Capacity
    layer_type: ecosystem_function
    analytical_level: 2
    category: ecosystem
    source_datasets: []
    dependencies:
      - canopy_cover_pct
      - esa_worldcover_10m
    output_format: cog
    description: Ecosystem cooling function proxy used for NbS opportunity screening.

  - layer_id: composite_risk
    layer_name: Composite Risk
    layer_type: risk
    analytical_level: 3
    category: risk
    source_datasets: []
    dependencies:
      - flood_hazard
      - heat_hazard
      - exposure_score
    output_format: cog
    description: Final risk index combining hazard intensity and exposure.

  - layer_id: nbs_opportunity_zones
    layer_name: NbS Opportunity Zones
    layer_type: decision_output
    analytical_level: 3
    category: decision
    source_datasets: []
    dependencies:
      - composite_risk
      - cooling_capacity
    model: models/nbs_opportunity_zones/
    output_format: pmtiles
    description: Priority intervention zones where ecosystem actions can reduce risk.

  - layer_id: nbs_flood_mechanism_type
    layer_name: Flood Mechanism Type
    layer_type: decision_output
    analytical_level: 3
    category: decision
    source_datasets: []
    dependencies:
      - flood_hazard
    model: models/nbs_flood_mechanism_type/
    output_format: cog
    description: Dominant flood mechanism type per cell for NbS screening.

  - layer_id: nbs_heat_mechanism_type
    layer_name: Heat Mechanism Type
    layer_type: decision_output
    analytical_level: 3
    category: decision
    source_datasets: []
    dependencies:
      - heat_hazard
    model: models/nbs_heat_mechanism_type/
    output_format: cog
    description: Dominant heat mechanism type per cell for NbS screening.

  - layer_id: nbs_landslide_mechanism_type
    layer_name: Landslide Mechanism Type
    layer_type: decision_output
    analytical_level: 3
    category: decision
    source_datasets: []
    dependencies: []
    model: models/nbs_landslide_mechanism_type/
    output_format: cog
    description: Dominant landslide mechanism type per cell for NbS screening.
