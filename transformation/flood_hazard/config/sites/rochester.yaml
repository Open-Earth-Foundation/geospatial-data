# City runtime config for flood_hazard
site_slug: rochester
display_name: Rochester
country: United States
admin_level: municipality
output_prefix: rochester
boundary_path: sites/rochester/boundary/site.geojson
bbox: [-92.573562, 43.884547, -92.389001, 44.108253]
s3_prefix: oef_calculation/release/v1/rochester/climate_hazards/floods

paths:
  site_root: sites/rochester
  data_input: sites/rochester/data/input
  data_intermediate: sites/rochester/data/intermediate
  data_output: sites/rochester/data/output
  out: sites/rochester/out
  cache: sites/rochester/cache
  styles: styles

layers:
  aqueduct_depth: aqueduct_depth_rp100_rochester.tif
  aqueduct_norm: aqueduct_depth_rp100_norm_rochester.tif
  gfd_count: gfd_flood_event_count_no_perm_water_rochester.tif
  gfd_count_norm: gfd_flood_event_count_no_perm_water_norm_rochester.tif
  gfd_observed_once: gfd_flood_observed_once_rochester.tif
  gfplain: gfplain_250m_rochester.tif
  jrc_depth: jrc_rp100_depth_rochester.tif
  jrc_norm: jrc_rp100_depth_norm_rochester.tif
  dem: rochester_dem_glo30_30m.tif

outputs:
  flood_hazard_score: flood_hazard_score_rochester.tif
  flood_hazard_score_strict: flood_hazard_score_strict_rochester.tif
  flood_hazard_n_layers_used: flood_hazard_n_layers_used_rochester.tif
  flood_hazard_score_idw: flood_hazard_score_idw_rochester.tif
  flood_hazard_is_interpolated: flood_hazard_is_interpolated_rochester.tif
  flood_hazard_interp_distance_m: flood_hazard_interp_distance_m_rochester.tif
  flood_hazard_score_interpolated_only: flood_hazard_score_interpolated_only_rochester.tif

# Optional overrides of models/flood_hazard/config.yaml (city wins on merge)
hazard:
  reference_grid: gfplain_250m
  weights:
    jrc_norm: 0.45
    gfd_count_norm: 0.30
    aqueduct_norm: 0.15
    gfplain_250m: 0.10
  min_layers: 3
  require_fluvial_layer: true
  fluvial_layers: [jrc_norm, aqueduct_norm]

idw:
  max_dist_m: 750
  min_neighbors: 3
  power: 2
  k_neighbors: 32
  use_gfplain_mask: false
