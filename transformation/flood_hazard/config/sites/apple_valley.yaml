# City runtime config for flood_hazard
site_slug: apple_valley
display_name: Apple Valley
country: United States
admin_level: municipality
output_prefix: apple_valley
boundary_path: sites/apple_valley/boundary/site.geojson
bbox: [-93.248351, 44.717336, -93.151344, 44.775887]
s3_prefix: oef_calculation/release/v1/apple_valley/climate_hazards/floods

paths:
  site_root: sites/apple_valley
  data_input: sites/apple_valley/data/input
  data_intermediate: sites/apple_valley/data/intermediate
  data_output: sites/apple_valley/data/output
  out: sites/apple_valley/out
  cache: sites/apple_valley/cache
  styles: styles

layers:
  aqueduct_depth: aqueduct_depth_rp100_apple_valley.tif
  aqueduct_norm: aqueduct_depth_rp100_norm_apple_valley.tif
  gfd_count: gfd_flood_event_count_no_perm_water_apple_valley.tif
  gfd_count_norm: gfd_flood_event_count_no_perm_water_norm_apple_valley.tif
  gfd_observed_once: gfd_flood_observed_once_apple_valley.tif
  gfplain: gfplain_250m_apple_valley.tif
  jrc_depth: jrc_rp100_depth_apple_valley.tif
  jrc_norm: jrc_rp100_depth_norm_apple_valley.tif
  dem: apple_valley_dem_glo30_30m.tif
  relative_elevation: apple_valley_relative_elevation_30m.tif
  depression_mask: apple_valley_depression_mask_30m.tif
  depression_depth: apple_valley_depression_depth_30m.tif

outputs:
  flood_hazard_score: flood_hazard_score_apple_valley.tif
  flood_hazard_score_strict: flood_hazard_score_strict_apple_valley.tif
  flood_hazard_n_layers_used: flood_hazard_n_layers_used_apple_valley.tif
  flood_hazard_score_idw: flood_hazard_score_idw_apple_valley.tif
  flood_hazard_is_interpolated: flood_hazard_is_interpolated_apple_valley.tif
  flood_hazard_interp_distance_m: flood_hazard_interp_distance_m_apple_valley.tif
  flood_hazard_score_interpolated_only: flood_hazard_score_interpolated_only_apple_valley.tif

# Optional overrides of models/flood_hazard/config.yaml (city wins on merge)
hazard:
  reference_grid: gfplain_250m
  weights:
    jrc_norm: 0.45
    gfd_count_norm: 0.30
    aqueduct_norm: 0.15
    gfplain_250m: 0.10
  min_layers: 3
  require_fluvial_layer: true
  fluvial_layers: [jrc_norm, aqueduct_norm]

idw:
  max_dist_m: 750
  min_neighbors: 3
  power: 2
  k_neighbors: 32
  use_gfplain_mask: false
