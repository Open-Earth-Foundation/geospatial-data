# City runtime config for flood_hazard
site_slug: plymouth
display_name: Plymouth
country: United States
admin_level: municipality
output_prefix: plymouth
boundary_path: sites/plymouth/boundary/site.geojson
bbox: [-93.522652, 44.978282, -93.400372, 45.066422]
s3_prefix: oef_calculation/release/v1/plymouth/climate_hazards/floods

paths:
  site_root: sites/plymouth
  data_input: sites/plymouth/data/input
  data_intermediate: sites/plymouth/data/intermediate
  data_output: sites/plymouth/data/output
  out: sites/plymouth/out
  cache: sites/plymouth/cache
  styles: styles

# Score CLI (`compute_flood_hazard.py`) requires these weight keys under data/input/
required_inputs:
  - jrc_norm
  - gfd_count_norm
  - aqueduct_norm
  - gfplain_250m

layers:
  aqueduct_depth: aqueduct_depth_rp100_plymouth.tif
  aqueduct_norm: aqueduct_depth_rp100_norm_plymouth.tif
  gfd_count: gfd_flood_event_count_no_perm_water_plymouth.tif
  gfd_count_norm: gfd_flood_event_count_no_perm_water_norm_plymouth.tif
  gfd_observed_once: gfd_flood_observed_once_plymouth.tif
  gfplain: gfplain_250m_plymouth.tif
  jrc_depth: jrc_rp100_depth_plymouth.tif
  jrc_norm: jrc_rp100_depth_norm_plymouth.tif
  dem: plymouth_dem_glo30_30m.tif
  relative_elevation: plymouth_relative_elevation_30m.tif
  depression_mask: plymouth_depression_mask_30m.tif
  depression_depth: plymouth_depression_depth_30m.tif

outputs:
  flood_hazard_score: flood_hazard_score_plymouth.tif
  flood_hazard_score_strict: flood_hazard_score_strict_plymouth.tif
  flood_hazard_n_layers_used: flood_hazard_n_layers_used_plymouth.tif
  flood_hazard_score_idw: flood_hazard_score_idw_plymouth.tif
  flood_hazard_is_interpolated: flood_hazard_is_interpolated_plymouth.tif
  flood_hazard_interp_distance_m: flood_hazard_interp_distance_m_plymouth.tif
  flood_hazard_score_interpolated_only: flood_hazard_score_interpolated_only_plymouth.tif

# Optional overrides of models/flood_hazard/config.yaml (city wins on merge)
hazard:
  reference_grid: gfplain_250m
  weights:
    jrc_norm: 0.45
    gfd_count_norm: 0.30
    aqueduct_norm: 0.15
    gfplain_250m: 0.10
  min_layers: 3
  require_fluvial_layer: true
  fluvial_layers: [jrc_norm, aqueduct_norm]

idw:
  max_dist_m: 750
  min_neighbors: 3
  power: 2
  k_neighbors: 32
  use_gfplain_mask: false
