# City runtime config for flood_hazard
site_slug: richfield
display_name: Richfield
country: United States
admin_level: municipality
output_prefix: richfield
boundary_path: sites/richfield/boundary/site.geojson
bbox: [-93.318836, 44.861813, -93.244825, 44.890801]
s3_prefix: oef_calculation/release/v1/richfield/climate_hazards/floods

paths:
  site_root: sites/richfield
  data_input: sites/richfield/data/input
  data_intermediate: sites/richfield/data/intermediate
  data_output: sites/richfield/data/output
  out: sites/richfield/out
  cache: sites/richfield/cache
  styles: styles

layers:
  aqueduct_depth: aqueduct_depth_rp100_richfield.tif
  aqueduct_norm: aqueduct_depth_rp100_norm_richfield.tif
  gfd_count: gfd_flood_event_count_no_perm_water_richfield.tif
  gfd_count_norm: gfd_flood_event_count_no_perm_water_norm_richfield.tif
  gfd_observed_once: gfd_flood_observed_once_richfield.tif
  gfplain: gfplain_250m_richfield.tif
  jrc_depth: jrc_rp100_depth_richfield.tif
  jrc_norm: jrc_rp100_depth_norm_richfield.tif
  dem: richfield_dem_glo30_30m.tif

outputs:
  flood_hazard_score: flood_hazard_score_richfield.tif
  flood_hazard_score_strict: flood_hazard_score_strict_richfield.tif
  flood_hazard_n_layers_used: flood_hazard_n_layers_used_richfield.tif
  flood_hazard_score_idw: flood_hazard_score_idw_richfield.tif
  flood_hazard_is_interpolated: flood_hazard_is_interpolated_richfield.tif
  flood_hazard_interp_distance_m: flood_hazard_interp_distance_m_richfield.tif
  flood_hazard_score_interpolated_only: flood_hazard_score_interpolated_only_richfield.tif

# Optional overrides of models/flood_hazard/config.yaml (city wins on merge)
hazard:
  reference_grid: gfplain_250m
  weights:
    jrc_norm: 0.45
    gfd_count_norm: 0.30
    aqueduct_norm: 0.15
    gfplain_250m: 0.10
  min_layers: 3
  require_fluvial_layer: true
  fluvial_layers: [jrc_norm, aqueduct_norm]

idw:
  max_dist_m: 750
  min_neighbors: 3
  power: 2
  k_neighbors: 32
  use_gfplain_mask: false
