# City runtime config for heat_hazard
site_slug: plymouth
display_name: Plymouth
country: United States
admin_level: municipality
output_prefix: plymouth
season: jja
season_label: JJA
start_year: 2015
end_year: 2024
boundary_path: sites/plymouth/boundary/site.geojson
bbox: [-93.522652, 44.978282, -93.400372, 45.066422]
s3_prefix: oef_calculation/release/v1/plymouth/climate_hazards/heat

paths:
  site_root: sites/plymouth
  data_input: sites/plymouth/data/input
  data_intermediate: sites/plymouth/data/intermediate
  data_output: sites/plymouth/data/output
  out: sites/plymouth/out
  cache: sites/plymouth/cache
  styles: styles

# Score CLI (`compute_heat_hazard.py`) requires these keys under data/input/
required_inputs:
  - landsat_norm
  - modis_day_norm
  - modis_night_norm

layers:
  landsat_p90: lst_lc08_p90_jja_2015_2024_plymouth.tif
  landsat_obs_count: lst_lc08_obs_count_jja_2015_2024_plymouth.tif
  landsat_norm: lst_lc08_norm_jja_2015_2024_plymouth.tif
  modis_day_p90: mod11a2_lst_day_p90_jja_2015_2024_plymouth.tif
  modis_night_p90: mod11a2_lst_night_p90_jja_2015_2024_plymouth.tif
  modis_day_norm: mod11a2_lst_day_norm_jja_2015_2024_plymouth.tif
  modis_night_norm: mod11a2_lst_night_norm_jja_2015_2024_plymouth.tif
  era5_hw_freq: era5_hw_freq_jja_2015_2024_plymouth.tif
  era5_hw_norm: era5_hw_norm_jja_2015_2024_plymouth.tif

outputs:
  heat_hazard_score: heat_hazard_score_plymouth.tif
  heat_hazard_n_layers: heat_hazard_n_layers_plymouth.tif
  heat_hazard_vector: heat_hazard_score_plymouth.gpkg

# Optional overrides of models/heat_hazard/config.yaml (city wins on merge)
hazard:
  min_layers: 2
  reference_layer: landsat_norm
  include_era5: false

publish:
  tile_zoom: "8-15"

# Neighbourhood aggregation not configured for Minnesota cities yet
bairro:
  enabled: false
  mun_code: null
  layer: null
  gpkg_path: null
