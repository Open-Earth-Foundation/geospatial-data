# City runtime config for heat_hazard
site_slug: rochester
display_name: Rochester
country: United States
admin_level: municipality
output_prefix: rochester
season: jja
season_label: JJA
start_year: 2015
end_year: 2024
boundary_path: sites/rochester/boundary/site.geojson
bbox: [-92.573562, 43.884547, -92.389001, 44.108253]
s3_prefix: oef_calculation/release/v1/rochester/climate_hazards/heat

paths:
  site_root: sites/rochester
  data_input: sites/rochester/data/input
  data_intermediate: sites/rochester/data/intermediate
  data_output: sites/rochester/data/output
  out: sites/rochester/out
  cache: sites/rochester/cache
  styles: styles

layers:
  landsat_p90: lst_lc08_p90_jja_2015_2024_rochester.tif
  landsat_obs_count: lst_lc08_obs_count_jja_2015_2024_rochester.tif
  landsat_norm: lst_lc08_norm_jja_2015_2024_rochester.tif
  modis_day_p90: mod11a2_lst_day_p90_jja_2015_2024_rochester.tif
  modis_night_p90: mod11a2_lst_night_p90_jja_2015_2024_rochester.tif
  modis_day_norm: mod11a2_lst_day_norm_jja_2015_2024_rochester.tif
  modis_night_norm: mod11a2_lst_night_norm_jja_2015_2024_rochester.tif
  era5_hw_freq: era5_hw_freq_jja_2015_2024_rochester.tif
  era5_hw_norm: era5_hw_norm_jja_2015_2024_rochester.tif

outputs:
  heat_hazard_score: heat_hazard_score_rochester.tif
  heat_hazard_n_layers: heat_hazard_n_layers_rochester.tif
  heat_hazard_vector: heat_hazard_score_rochester.gpkg

# Optional overrides of models/heat_hazard/config.yaml (city wins on merge)
hazard:
  min_layers: 2
  reference_layer: landsat_norm
  include_era5: false

publish:
  tile_zoom: "8-15"

# Neighbourhood aggregation not configured for Minnesota cities yet
bairro:
  enabled: false
  mun_code: null
  layer: null
  gpkg_path: null
