# City runtime config for landslide_hazard
site_slug: plymouth
display_name: Plymouth
country: United States
admin_level: municipality
output_prefix: plymouth
season: jja
season_label: JJA
start_year: 2015
end_year: 2024
dw_year: 2023
boundary_path: sites/plymouth/boundary/site.geojson
bbox: [-93.522652, 44.978282, -93.400372, 45.066422]
s3_prefix: oef_calculation/release/v1/plymouth/climate_hazards/landslides

paths:
  site_root: sites/plymouth
  data_input: sites/plymouth/data/input
  data_intermediate: sites/plymouth/data/intermediate
  data_output: sites/plymouth/data/output
  out: sites/plymouth/out
  cache: sites/plymouth/cache
  styles: styles

layers:
  slope_deg: plymouth_slope_deg_30m.tif
  r90p: plymouth_r90p_climatology.tif
  clay_pct: plymouth_clay_pct_250m.tif
  ndvi_p10: plymouth_ndvi_p10_jja_2015_2024.tif
  hand: plymouth_hand_90m.tif
  dw_mode: plymouth_dw_mode_2023.tif

outputs:
  landslide_hazard_score: landslide_hazard_score_plymouth_90m.tif
  landslide_hazard_vector: landslide_hazard_score_plymouth.gpkg

# Optional overrides of models/landslide_hazard/config.yaml
hazard:
  target_resolution_m: 90

publish:
  tile_zoom: "8-15"

bairro:
  enabled: false
  mun_code: null
  layer: null
  gpkg_path: null
