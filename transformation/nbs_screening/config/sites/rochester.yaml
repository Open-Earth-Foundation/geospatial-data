# NBS grid screening — Rochester, MN
# Full layer inventory aligned with config/sites/porto_alegre.yaml.
# Local paths are extraction targets; runtime skips layers whose files are missing.
#
# Status key (inline):
#   [CCRA]  hazard/risk/DEM from CCRA pipeline (may already exist)
#   [INPUT] landslide_hazard / heat_hazard / flood_hazard data/input
#   [PUB]   flood_risk publish (exposure / vulnerability COG source)
#   [TODO]  extract CLI or notebook not yet run for MN

site_slug: rochester
display_name: Rochester
country: United States

open_water:
  enabled: false
  # When JRC GSW is extracted, enable and wire transition + occurrence layers below.

osm_waterways:
  local: transformation/nbs_screening/flood/sites/rochester/data/input/osm_waterways_rochester.json  # flood/extract_osm_rivers.py

reference_hazard:
  flood: flood_hazard
  heat: heat_hazard
  landslide: landslide_hazard

catalog:
  shared:
    exposure:
      local: transformation/flood_risk/sites/rochester/data/output/flood_exposure_score_rochester.tif  # [PUB] flood_risk_publish --product exposure
    vulnerability:
      local: transformation/flood_risk/sites/rochester/data/output/flood_vulnerability_score_rochester.tif  # [PUB] flood_risk_publish --product vulnerability
    ghsl_built_up:
      local: transformation/ghsl_built_up/sites/rochester/data/output/rochester_ghsl_built_up_100m.tif  # ghsl_built_up/extract_ghsl_built_up.py
    dynamic_world:
      local: transformation/dynamic_world/sites/rochester/data/output/rochester_dynamicworld_2023.tif  # dynamic_world/extract_dw_mode.py
    dynamic_world_mode_250m:
      local: transformation/dynamic_world/sites/rochester/data/output/rochester_dw_mode_250m_2023.tif  # dynamic_world/extract_dw_mode.py
    modis_ndvi:
      local: transformation/modis_ndvi/sites/rochester/data/output/rochester_modis_ndvi_mean.tif  # modis_ndvi/extract_ndvi_mean.py
    copernicus_dem:
      local: transformation/flood_hazard/sites/rochester/data/input/rochester_dem_glo30_30m.tif  # [CCRA]
    merit_hand:
      local: transformation/landslide_hazard/sites/rochester/data/input/rochester_hand_90m.tif  # [INPUT] merit_hydro/extract_hand.py

  flood:
    flood_hazard:
      local: transformation/flood_hazard/sites/rochester/data/output/flood_hazard_score_idw_rochester.tif  # [CCRA]
    flood_risk:
      local: transformation/flood_risk/sites/rochester/data/output/flood_risk_score_rochester.tif  # [CCRA]
    merit_upa:
      local: transformation/merit_hydro/sites/rochester/data/output/rochester_merit_hydro_upa_90m.tif  # merit_hydro/extract_merit_hydro.py
    merit_elv:
      local: transformation/merit_hydro/sites/rochester/data/output/rochester_merit_hydro_elv_90m.tif  # merit_hydro/extract_merit_hydro.py
    jrc_surface_water_transition:
      local: transformation/jrc_global_surface_water/sites/rochester/data/output/rochester_gsw_transition_30m.tif  # jrc_global_surface_water/extract_gsw.py
    jrc_surface_water_occurrence:
      local: transformation/jrc_global_surface_water/sites/rochester/data/output/rochester_gsw_occurrence_30m.tif  # jrc_global_surface_water/extract_gsw.py
    jrc_surface_water_seasonality:
      local: transformation/jrc_global_surface_water/sites/rochester/data/output/rochester_gsw_seasonality_30m.tif  # jrc_global_surface_water/extract_gsw.py
    copernicus_emsn194:
      local: transformation/copernicus_emsn194/sites/rochester/data/output/rochester_maxwaterdepth.tif  # [TODO] POA-only event product; optional for MN
    chirps_rx1day_2024:
      local: transformation/chirps_daily/sites/rochester/data/output/rochester_rx1day_2024.tif  # chirps_daily/extract_chirps_daily.py
    chirps_rx5day_2024:
      local: transformation/chirps_daily/sites/rochester/data/output/rochester_rx5day_2024.tif  # chirps_daily/extract_chirps_daily.py
    chirps_r90p_2024:
      local: transformation/chirps_daily/sites/rochester/data/output/rochester_r90p_2024.tif  # chirps_daily/extract_chirps_daily.py
    gfplain250m:
      local: transformation/flood_hazard/sites/rochester/data/input/gfplain_250m_rochester.tif  # [CCRA]
    poa_relative_elevation:
      local: transformation/flood_hazard/sites/rochester/data/output/rochester_relative_elevation_30m.tif  # compute_dem_diagnostics.py
    poa_depression_mask:
      local: transformation/flood_hazard/sites/rochester/data/output/rochester_depression_mask_30m.tif  # compute_dem_diagnostics.py
    poa_depression_depth:
      local: transformation/flood_hazard/sites/rochester/data/output/rochester_depression_depth_30m.tif  # compute_dem_diagnostics.py
    poa_slope:
      local: transformation/landslide_hazard/sites/rochester/data/input/rochester_slope_deg_30m.tif  # copernicus_dem/extract_slope.py
    soilgrids_clay:
      local: transformation/landslide_hazard/sites/rochester/data/input/rochester_clay_pct_250m.tif  # [INPUT] soilgrids/extract_clay.py

  heat:
    heat_hazard:
      local: transformation/heat_hazard/sites/rochester/data/output/heat_hazard_score_rochester.tif  # [CCRA]
    heat_risk:
      local: transformation/heat_risk/sites/rochester/data/output/heat_risk_score_rochester.tif  # [CCRA]
    hansen_treecover2000:
      local: transformation/hansen_forest_change/sites/rochester/data/output/rochester_hansen_treecover2000_30m.tif  # hansen_forest_change/extract_treecover2000.py
    landsat8_lst_djf:
      local: transformation/heat_hazard/sites/rochester/data/input/lst_lc08_p90_jja_2015_2024_rochester.tif  # [INPUT] MN uses JJA (not POA DJF)
    modis_lst_day_p90:
      local: transformation/heat_hazard/sites/rochester/data/input/mod11a2_lst_day_p90_jja_2015_2024_rochester.tif  # [INPUT]
    modis_lst_night_p90:
      local: transformation/heat_hazard/sites/rochester/data/input/mod11a2_lst_night_p90_jja_2015_2024_rochester.tif  # [INPUT]
    poa_slope:
      local: transformation/landslide_hazard/sites/rochester/data/input/rochester_slope_deg_30m.tif  # copernicus_dem/extract_slope.py
    soilgrids_clay:
      local: transformation/landslide_hazard/sites/rochester/data/input/rochester_clay_pct_250m.tif  # [INPUT]

  landslide:
    landslide_hazard:
      local: transformation/landslide_hazard/sites/rochester/data/output/landslide_hazard_score_rochester_90m.tif  # [CCRA]
    landslide_risk:
      local: transformation/landslide_risk/sites/rochester/data/output/landslide_risk_score_rochester.tif  # [CCRA]
    chirps_r90p_climatology:
      local: transformation/landslide_hazard/sites/rochester/data/input/rochester_r90p_climatology.tif  # [INPUT] chirps_r90p/extract_chirps_r90p.py
    hansen_treecover2000:
      local: transformation/hansen_forest_change/sites/rochester/data/output/rochester_hansen_treecover2000_30m.tif  # hansen_forest_change/extract_treecover2000.py
    dynamic_world_mode_250m:
      local: transformation/dynamic_world/sites/rochester/data/output/rochester_dw_mode_250m_2023.tif  # dynamic_world/extract_dw_mode.py
    merit_upa:
      local: transformation/merit_hydro/sites/rochester/data/output/rochester_merit_hydro_upa_90m.tif  # merit_hydro/extract_merit_hydro.py
    poa_slope:
      local: transformation/landslide_hazard/sites/rochester/data/input/rochester_slope_deg_30m.tif  # copernicus_dem/extract_slope.py
    soilgrids_clay:
      local: transformation/landslide_hazard/sites/rochester/data/input/rochester_clay_pct_250m.tif  # [INPUT]
    ndvi_p10_djf:
      local: transformation/landslide_hazard/sites/rochester/data/input/rochester_ndvi_p10_jja_2015_2024.tif  # [INPUT] MN uses JJA (not POA DJF)
    merit_hand:
      local: transformation/landslide_hazard/sites/rochester/data/input/rochester_hand_90m.tif  # [INPUT]
