  - dataset_id: poa_landslide_hazard
    dataset_name: Landslide Hazard Score (POA)
    publisher: Open Earth Foundation (derived processing)
    license: CC BY 4.0
    resolution: ~90m
    crs: EPSG:4326
    access_type: internal_storage
    source_url: https://developers.google.com/earth-engine/datasets/catalog/COPERNICUS_DEM_GLO30
    dataset_type: landslide
    type: numeric_raster
    data_quality:
      temporal_coverage: >
        Static terrain layers (Copernicus GLO-30 DEM slope, MERIT Hydro HAND, SoilGrids clay);
        climate layer CHIRPS R90p long-run climatology;
        vegetation MODIS NDVI P10 DJF 2015–2024;
        land cover Dynamic World mode 2023.
      accuracy: >
        Weighted ensemble of five normalized terrain and climate layers on a 90 m grid.
        Formula: H = clamp01(0.45×slope_risk + 0.20×precip_risk×slope_risk
        + 0.15×low_cohesion×slope_risk + 0.10×lack_of_veg×slope_risk
        + 0.10×hand_factor×slope_risk) ± Dynamic World land cover modifier.
        Slope activation gate: slope < 15° → H = 0.
      limitations: >
        Susceptibility index only — not failure probability or event frequency.
        CHIRPS R90p at ~5 km; nearest-neighbour resampled to 90 m.
        Not validated against CEMADEN or INMET historical landslide inventory.
        Static: does not capture time-varying antecedent moisture or seasonal vegetation dynamics.
    value_encoding:
      type: rgb_24bit_scaled
      scale: 10000
      offset: 0.0
      unit: "score"
      decode_formula: "value = (R + 256*G + 65536*B) / scale"
    assets:
      visual_tiles:
