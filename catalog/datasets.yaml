datasets:
  - dataset_id: dynamic_world
    dataset_name: Dynamic World V1 
    publisher: World Resources Institute Google
    license: CC-BY 4.0
    resolution: 10m
    access_type: gee
    source_url: https://developers.google.com/earth-engine/datasets/catalog/GOOGLE_DYNAMICWORLD_V1#description
    dataset_type: land_cover
    type: categorical_raster
    data_quality:
      temporal_coverage: "2015 to present (annual composites)"
      accuracy: "Deep learning classification; ~10m resolution"
      limitations: "Annual composite, cloud-filtered; may underrepresent ephemeral land cover"
    value_encoding:
      type: class_lookup
      classes:
        0: { name: Water, color: "#62B0CC" }
        1: { name: Trees, color: "#488C5F" }
        2: { name: Grass, color: "#98B982" }
        3: { name: Flooded vegetation, color: "#A0AAC3" }
        4: { name: Crops, color: "#D7A55F" }
        5: { name: Shrub, color: "#CDB982" }
        6: { name: Built, color: "#B45F55" }
        7: { name: Bare, color: "#AFA89E" }
        8: { name: Snow, color: "#B9CDE1" }
    assets:
      visual_tiles:
        url_template:
          - https://geo-test-api.s3.us-east-1.amazonaws.com/dynamic_world/release/v1/2023/porto_alegre/tiles_visual/{z}/{x}/{y}.png
      value_tiles:
        url_template:
          - https://geo-test-api.s3.us-east-1.amazonaws.com/dynamic_world/release/v1/2023/porto_alegre/tiles_values/{z}/{x}/{y}.png
      download:
        cog_url:
          - https://geo-test-api.s3.us-east-1.amazonaws.com/dynamic_world/release/v1/2023/porto_alegre/poa_dynamicworld_cog.tif
      metadata:
        url:
          - https://geo-test-api.s3.us-east-1.amazonaws.com/dynamic_world/release/v1/2023/porto_alegre/metadata.json
    description: Versioned categorical land-use raster exposed by the test API for Porto Alegre.

  - dataset_id: poa_gtfs
    dataset_name: GTFS Porto Alegre
    publisher: EPTC (Empresa Pública de Transporte e Circulação)
    license: CC BY 4.0
    resolution: vector
    crs: EPSG:4326
    access_type: manual_download
    source_url: https://dadosabertos.poa.br/dataset/gtfs
    dataset_type: transport
    type: vector
    assets:
      bus_routes:
        url_template: https://geo-test-api.s3.us-east-1.amazonaws.com/poa-gtfs/release/2024-10-01/shapes.geojson
      bus_stops:
        url_template: https://geo-test-api.s3.us-east-1.amazonaws.com/poa-gtfs/release/2024-10-01/stops.geojson
    description: >
      General Transit Feed Specification (GTFS) for Porto Alegre bus transit.
      Includes routes, stops, shapes, and schedules.

  - dataset_id: jrc_global_surface_water
    dataset_name: JRC Global Surface Water (Transition)
    publisher: JRC (Joint Research Centre)
    license: CC BY 4.0
    resolution: 30m
    crs: EPSG:3857
    access_type: gee
    source_url: https://developers.google.com/earth-engine/datasets/catalog/JRC_GSW1_4_GlobalSurfaceWater
    dataset_type: water
    type: categorical_raster
    data_quality:
      temporal_coverage: "1984–2021"
      accuracy: "Landsat-based; transition between first/last year"
      limitations: "Categorical change classes only"
    value_encoding:
      type: class_lookup
      classes:
        0: { name: No change, color: "#FFFFFF" }
        1: { name: Permanent water, color: "#0000FF" }
        2: { name: New permanent, color: "#22B14C" }
        3: { name: Lost permanent, color: "#D1102D" }
        4: { name: Seasonal water, color: "#99D9EA" }
        5: { name: New seasonal, color: "#B5E61D" }
        6: { name: Lost seasonal, color: "#E6A1AA" }
        7: { name: Seasonal to permanent, color: "#FF7F27" }
        8: { name: Permanent to seasonal, color: "#FFC90E" }
        9: { name: Ephemeral permanent, color: "#7F7F7F" }
        10: { name: Ephemeral seasonal, color: "#C3C3C3" }
    assets:
      visual_tiles:
        url_template: https://geo-test-api.s3.us-east-1.amazonaws.com/jrc_global_surface_water/release/v1/porto_alegre/transition/tiles_visual/{z}/{x}/{y}.png
      value_tiles:
        url_template: https://geo-test-api.s3.us-east-1.amazonaws.com/jrc_global_surface_water/release/v1/porto_alegre/transition/tiles_values/{z}/{x}/{y}.png
      download:
        cog_url: https://geo-test-api.s3.us-east-1.amazonaws.com/jrc_global_surface_water/release/v1/porto_alegre/transition/poa_gsw_transition_30m_v1_4_cog.tif
      metadata:
        url: []
    description: >
      JRC Global Surface Water v1.4 transition classes for Porto Alegre.
      Water regime change (permanent, seasonal, lost, new). Supports flood/drought adaptation planning.

  - dataset_id: global_solar_atlas
    dataset_name: Global Solar Atlas PV Output
    publisher: World Bank Group, Solargis
    license: Free for non-commercial use
    resolution: 930m
    crs: EPSG:3857
    access_type: manual_download
    source_url: https://globalsolaratlas.info/download/brazil
    dataset_type: solar
    type: numeric_raster
    data_quality:
      temporal_coverage: "1999-2018 (LTAy)"
      accuracy: "±4% typical for PVOUT"
      limitations: "Regional screening; site-specific validation recommended for project planning"
    value_encoding:
      type: terrain_rgb
      scale: 0.001
      offset: 0.0
      unit: "kWh/kWp/day"
      decode_formula: "value = (R * 256 * 256 + G * 256 + B) * scale + offset"
    assets:
      visual_tiles:
        url_template: https://geo-test-api.s3.us-east-1.amazonaws.com/global_solar_atlas/release/v2/tiles_pvout/{z}/{x}/{y}.png
      value_tiles:
        url_template: https://geo-test-api.s3.us-east-1.amazonaws.com/global_solar_atlas/release/v2/tiles_pvout_values/{z}/{x}/{y}.png
      download:
        cog_url: https://geo-test-api.s3.us-east-1.amazonaws.com/global_solar_atlas/release/v2/poa_PVOUT_cog.tif
      neighbourhoods:
        url_template: https://geo-test-api.s3.us-east-1.amazonaws.com/global_solar_atlas/release/v2/poa_solar_neighbourhoods.geojson
      metadata:
        url: https://geo-test-api.s3.us-east-1.amazonaws.com/global_solar_atlas/release/v2/pvout_metadata.json
    description: >
      PV Output (kWh/kWp/day) from Global Solar Atlas Brazil LTAy AvgDailyTotals.

  - dataset_id: ghsl_built_up
    dataset_name: GHSL Built-Up Settlement Grid
    publisher: JRC (Joint Research Centre)
    license: CC BY 4.0
    resolution: 100m
    crs: EPSG:3857
    access_type: gee
    source_url: https://developers.google.com/earth-engine/datasets/catalog/JRC_GHSL_P2023A_GHS_BUILT_S
    dataset_type: built_up
    type: numeric_raster
    data_quality:
      temporal_coverage: "2025 (P2023A)"
      accuracy: "Built-up surface in m² per 100m grid cell"
      limitations: "Clamped 0–10000 m² for value tiles"
    value_encoding:
      type: rgb_packed
      scale: 1.0
      offset: 0.0
      unit: "m²"
      decode_formula: "value = R + 256*G + 65536*B"
    assets:
      visual_tiles:
        url_template: https://geo-test-api.s3.us-east-1.amazonaws.com/ghsl_built_up/release/v1/2025/porto_alegre/tiles_visual/{z}/{x}/{y}.png
      value_tiles:
        url_template: https://geo-test-api.s3.us-east-1.amazonaws.com/ghsl_built_up/release/v1/2025/porto_alegre/tiles_values/{z}/{x}/{y}.png
      download:
        cog_url: https://geo-test-api.s3.us-east-1.amazonaws.com/ghsl_built_up/release/v1/2025/porto_alegre/poa_ghsl_built_up_100m_p2023a_2025_cog.tif
      metadata:
        url: []
    description: >
      GHSL Built-Up P2023A built-up surface (m² per 100m cell) for Porto Alegre.
      Exported from GEE GHS_BUILT_S 2025, clipped and tiled for mapping.

  - dataset_id: ghsl_degree_urbanization
    dataset_name: GHSL Degree of Urbanization (SMOD)
    publisher: JRC (Joint Research Centre)
    license: CC BY 4.0
    resolution: 1000m
    crs: EPSG:3857
    access_type: gee
    source_url: https://developers.google.com/earth-engine/datasets/catalog/JRC_GHSL_P2023A_GHS_SMOD_V2-0
    dataset_type: settlement
    type: categorical_raster
    data_quality:
      temporal_coverage: "2025 (P2023A)"
      accuracy: "Eurostat Degree of Urbanisation methodology"
      limitations: "1 km grid; class from population and built-up density"
    value_encoding:
      type: class_lookup
      classes:
        10: { name: Water, color: "#7AB6F5" }
        11: { name: Very low density rural, color: "#CDF57A" }
        12: { name: Low density rural, color: "#ABCD66" }
        13: { name: Rural cluster, color: "#375623" }
        21: { name: Suburban or peri-urban, color: "#FFFF00" }
        22: { name: Semi-dense urban cluster, color: "#A87000" }
        23: { name: Dense urban cluster, color: "#732600" }
        30: { name: Urban centre, color: "#FF0000" }
    assets:
      visual_tiles:
        url_template: https://geo-test-api.s3.us-east-1.amazonaws.com/ghsl_degree_urbanization/release/v2/2024/porto_alegre/tiles_visual/{z}/{x}/{y}.png
      value_tiles:
        url_template: https://geo-test-api.s3.us-east-1.amazonaws.com/ghsl_degree_urbanization/release/v2/2024/porto_alegre/tiles_values/{z}/{x}/{y}.png
      download:
        cog_url: https://geo-test-api.s3.us-east-1.amazonaws.com/ghsl_degree_urbanization/release/v2/2024/porto_alegre/poa_ghsl_degree_urb_1000m_p2023a_2025_cog.tif
      metadata:
        url: []
    description: >
      GHSL Degree of Urbanization (SMOD) P2023A for Porto Alegre.
      Rural-urban classification (water, rural, suburban, urban centre) at 1 km resolution.

  - dataset_id: hansen_forest_change
    dataset_name: Hansen Global Forest Change (Loss)
    publisher: UMD / Google
    license: CC BY 4.0
    resolution: 30m
    crs: EPSG:3857
    access_type: gee
    source_url: https://developers.google.com/earth-engine/datasets/catalog/UMD_hansen_global_forest_change_2024_v1_12
    dataset_type: forest
    type: categorical_raster
    data_quality:
      temporal_coverage: "2000–2024"
      accuracy: "Stand-replacement forest loss from Landsat"
      limitations: "Binary loss only; lossyear band gives year of loss"
    value_encoding:
      type: class_lookup
      classes:
        0: { name: No loss, color: "#F0F0F0" }
        1: { name: Forest loss, color: "#FF0000" }
    assets:
      visual_tiles:
        url_template: https://geo-test-api.s3.us-east-1.amazonaws.com/hansen_forest_change/release/v1/2024/porto_alegre/loss/tiles_visual/{z}/{x}/{y}.png
      value_tiles:
        url_template: https://geo-test-api.s3.us-east-1.amazonaws.com/hansen_forest_change/release/v1/2024/porto_alegre/loss/tiles_values/{z}/{x}/{y}.png
      download:
        cog_url: https://geo-test-api.s3.us-east-1.amazonaws.com/hansen_forest_change/release/v1/2024/porto_alegre/loss/poa_hansen_loss_30m_v1_12_cog.tif
      metadata:
        url: []
    description: >
      Hansen Global Forest Change v1.12 forest loss for Porto Alegre.
      Binary: 0 = no loss, 1 = loss (2000–2024). Supports restoration and climate action planning.

  - dataset_id: ghsl_population
    dataset_name: GHSL Population Grid
    publisher: JRC (Joint Research Centre)
    license: CC BY 4.0
    resolution: 100m
    crs: EPSG:3857
    access_type: gee
    source_url: https://developers.google.com/earth-engine/datasets/catalog/JRC_GHSL_P2023A_GHS_POP
    dataset_type: population
    type: numeric_raster
    data_quality:
      temporal_coverage: "2025 (P2023A)"
      accuracy: "Inhabitants per 100m grid cell"
      limitations: "Clamped 0–16777215 for value tiles (24-bit rgb_packed)"
    value_encoding:
      type: rgb_packed
      scale: 1.0
      offset: 0.0
      unit: "inhabitants"
      decode_formula: "value = R + 256*G + 65536*B"
    assets:
      visual_tiles:
        url_template: https://geo-test-api.s3.us-east-1.amazonaws.com/ghsl_population/release/v1/2025/porto_alegre/tiles_visual/{z}/{x}/{y}.png
      value_tiles:
        url_template: https://geo-test-api.s3.us-east-1.amazonaws.com/ghsl_population/release/v1/2025/porto_alegre/tiles_values/{z}/{x}/{y}.png
      download:
        cog_url: https://geo-test-api.s3.us-east-1.amazonaws.com/ghsl_population/release/v1/2025/porto_alegre/poa_ghsl_pop_100m_p2023a_2025_cog.tif
      metadata:
        url: []
    description: >
      GHSL Population P2023A inhabitants per 100m cell for Porto Alegre.
      Exported from GEE GHS_POP 2025, clipped and tiled for mapping.

  - dataset_id: br_ibge
    dataset_name: IBGE Census Data
    publisher: IBGE (Instituto Brasileiro de Geografia e Estatística)
    license: CC BY 4.0
    resolution: vector
    crs: EPSG:4326
    access_type: public_api
    source_url: https://servicodados.ibge.gov.br/api/docs
    dataset_type: census
    type: vector
    data_quality:
      temporal_coverage: "2010 (indicators), 2022 (informal settlements)"
      accuracy: "Official statistics; possible undercount in informal areas"
      limitations: "Indicators from Census 2010; FCU boundaries from Census 2022; some FCUs not yet sectorized"
    assets:
      indicators:
        url_template: https://geo-test-api.s3.us-east-1.amazonaws.com/br_ibge/release/2010/porto_alegre/porto_alegre_indicators.geojson
      informal_settlements:
        url_template: https://geo-test-api.s3.us-east-1.amazonaws.com/br_ibge/release/2024/porto_alegre/poa_informal_settlements.geojson
    description: >
      IBGE Census data for Porto Alegre. Includes neighbourhood-level indicators (Census 2010, SIDRA API)
      and informal settlement polygons (Census 2022, favelas e comunidades urbanas).

  - dataset_id: poa_exposure
    dataset_name: Exposure Score — Population Density (POA, shared)
    publisher: IBGE (source indicators), Open Earth Foundation (grid rasterization)
    license: CC BY 4.0
    resolution: ~250m
    crs: EPSG:4326
    access_type: internal_storage
    source_url: https://servicodados.ibge.gov.br/api/docs
    dataset_type: shared
    type: numeric_raster
    data_quality:
      temporal_coverage: "Census 2022 (Censo 2022 population by neighbourhood)"
      accuracy: "Min–max normalized population density (people/km²) per POA neighbourhood, burned to canonical 250 m grid"
      limitations: >
        Constant exposure score within each bairro polygon; polygon area includes parks, water bodies,
        and industrial zones that may underestimate residential density in some bairros.
        Screening proxy, not asset inventory.
    value_encoding:
      type: rgb_24bit_scaled
      scale: 10000
      offset: 0.0
      unit: "score"
      decode_formula: "value = (R + 256*G + 65536*B) / scale"
    assets:
      visual_tiles:
        url_template: https://geo-test-api.s3.us-east-1.amazonaws.com/oef_calculation/release/v1/porto_alegre/shared/exposure/tiles_visual/{z}/{x}/{y}.png
      value_tiles:
        url_template: https://geo-test-api.s3.us-east-1.amazonaws.com/oef_calculation/release/v1/porto_alegre/shared/exposure/tiles_values/{z}/{x}/{y}.png
      download:
        cog_url: https://geo-test-api.s3.us-east-1.amazonaws.com/oef_calculation/release/v1/porto_alegre/shared/exposure/exposure_cog.tif
      metadata:
        url: []
    description: >
      Shared neighbourhood exposure score (0–1) for Porto Alegre on a canonical 250 m grid.
      Derived from IBGE Censo 2022 population, computed as population density (people/km²) per bairro,
      min–max normalized across all POA bairros. Used as the E component in both flood and heat risk scores.
      Computed by `shared/compute_ev.ipynb`.

  - dataset_id: poa_vulnerability
    dataset_name: Vulnerability Score — Vulnerable Age Share (POA, shared)
    publisher: IBGE (source indicators), Open Earth Foundation (grid rasterization)
    license: CC BY 4.0
    resolution: ~250m
    crs: EPSG:4326
    access_type: internal_storage
    source_url: https://servicodados.ibge.gov.br/api/docs
    dataset_type: shared
    type: numeric_raster
    data_quality:
      temporal_coverage: "Census 2022 (Censo 2022 age structure by neighbourhood)"
      accuracy: "Min–max normalized share of population aged 0–4 or 60+ per POA neighbourhood, burned to canonical 250 m grid"
      limitations: "Constant vulnerability score within each bairro polygon; age-only proxy; poverty not included (not available at bairro level in Censo 2022 aggregates)"
    value_encoding:
      type: rgb_24bit_scaled
      scale: 10000
      offset: 0.0
      unit: "score"
      decode_formula: "value = (R + 256*G + 65536*B) / scale"
    assets:
      visual_tiles:
        url_template: https://geo-test-api.s3.us-east-1.amazonaws.com/oef_calculation/release/v1/porto_alegre/shared/vulnerability/tiles_visual/{z}/{x}/{y}.png
      value_tiles:
        url_template: https://geo-test-api.s3.us-east-1.amazonaws.com/oef_calculation/release/v1/porto_alegre/shared/vulnerability/tiles_values/{z}/{x}/{y}.png
      download:
        cog_url: https://geo-test-api.s3.us-east-1.amazonaws.com/oef_calculation/release/v1/porto_alegre/shared/vulnerability/vulnerability_cog.tif
      metadata:
        url: []
    description: >
      Shared neighbourhood vulnerability score (0–1) for Porto Alegre on a canonical 250 m grid.
      Derived from IBGE Censo 2022 age data: share of population aged 0–4 or 60+ per bairro,
      min–max normalized across all POA bairros. Used as the V component in both flood and heat risk scores.
      Computed by `shared/compute_ev.ipynb`.

  - dataset_id: poa_flood_hazard
    dataset_name: Flood Hazard Score (POA)
    publisher: Open Earth Foundation (derived processing)
    license: CC BY 4.0
    resolution: ~250m
    crs: EPSG:3857
    access_type: internal_storage
    source_url: https://developers.google.com/earth-engine/datasets/catalog/JRC_GLOFLOR_V2_1
    dataset_type: flood
    type: numeric_raster
    data_quality:
      temporal_coverage: "Static hazard layers (JRC, Aqueduct, GFD, GFPLAIN ensemble)"
      accuracy: "Weighted ensemble of normalized global fluvial hazard products; partial coverage rule (>=3/4 layers + fluvial)"
      limitations: "Hazard screening only (no exposure/vulnerability); not event-specific May 2024 depth"
    value_encoding:
      type: rgb_24bit_scaled
      scale: 10000
      offset: 0.0
      unit: "score"
      decode_formula: "value = (R + 256*G + 65536*B) / scale"
    assets:
      visual_tiles:
        url_template: https://geo-test-api.s3.us-east-1.amazonaws.com/oef_calculation/release/v1/porto_alegre/climate_hazards/floods/hazard/tiles_visual/{z}/{x}/{y}.png
      value_tiles:
        url_template: https://geo-test-api.s3.us-east-1.amazonaws.com/oef_calculation/release/v1/porto_alegre/climate_hazards/floods/hazard/tiles_values/{z}/{x}/{y}.png
      download:
        cog_url: https://geo-test-api.s3.us-east-1.amazonaws.com/oef_calculation/release/v1/porto_alegre/climate_hazards/floods/hazard/flood_hazard_score_cog.tif
      metadata:
        url: []
    description: >
      OEF flood hazard susceptibility index (0–1) for Porto Alegre. Ensemble of JRC GLOFLO v2.1, Global Flood Database,
      WRI Aqueduct, and GFPLAIN250m on a common ~250 m grid. Documented in `flood_hazard_score_methodology.md`.

  - dataset_id: poa_flood_risk
    dataset_name: Flood Risk Score H×E×V (POA)
    publisher: Open Earth Foundation (derived processing)
    license: CC BY 4.0
    resolution: ~250m
    crs: EPSG:3857
    access_type: internal_storage
    source_url: https://servicodados.ibge.gov.br/api/docs
    dataset_type: flood
    type: numeric_raster
    data_quality:
      temporal_coverage: "Static composite from current hazard + neighborhood E/V rasterization"
      accuracy: "R = (H × E × V)^(1/3) on cells where all three components are finite"
      limitations: "Screening-level composite; E/V constant per barrio; not IPCC full risk or loss modeling"
    value_encoding:
      type: rgb_24bit_scaled
      scale: 10000
      offset: 0.0
      unit: "score"
      decode_formula: "value = (R + 256*G + 65536*B) / scale"
    assets:
      visual_tiles:
        url_template: https://geo-test-api.s3.us-east-1.amazonaws.com/oef_calculation/release/v1/porto_alegre/climate_hazards/floods/risk/tiles_visual/{z}/{x}/{y}.png
      value_tiles:
        url_template: https://geo-test-api.s3.us-east-1.amazonaws.com/oef_calculation/release/v1/porto_alegre/climate_hazards/floods/risk/tiles_values/{z}/{x}/{y}.png
      download:
        cog_url: https://geo-test-api.s3.us-east-1.amazonaws.com/oef_calculation/release/v1/porto_alegre/climate_hazards/floods/risk/flood_risk_score_cog.tif
      metadata:
        url: []
    description: >
      OEF flood risk screening index (0–1) for Porto Alegre: geometric mean of hazard (OEF ensemble), exposure
      (IBGE population grid), and vulnerability (IBGE poverty + age grid). Documented in `flood_risk_score_methodology.md`.

  - dataset_id: noaa_viirs_nightlights
    dataset_name: NOAA VIIRS Night Lights
    publisher: NOAA
    license: Public domain
    resolution: 500m
    crs: EPSG:3857
    access_type: gee
    source_url: https://developers.google.com/earth-engine/datasets/catalog/NOAA_VIIRS_DNB_MONTHLY_V1_VCMSLCFG
    dataset_type: night_lights
    type: numeric_raster
    data_quality:
      temporal_coverage: "2014 to present (monthly composites)"
      accuracy: "Stray-light corrected; avg_rad in nW/cm²/sr"
      limitations: "VCMSLCFG extends coverage toward poles with reduced quality; cf_cvg band indicates cloud-free coverage"
    value_encoding:
      type: terrain_rgb
      scale: 0.1
      offset: 0.0
      unit: "nW/cm²/sr"
      decode_formula: "value = (R * 256 * 256 + G * 256 + B) * scale + offset"
    assets:
      visual_tiles:
        url_template: https://geo-test-api.s3.us-east-1.amazonaws.com/noaa_viirs_nightlights/release/v1/2024/tiles_visual/{z}/{x}/{y}.png
      value_tiles:
        url_template: https://geo-test-api.s3.us-east-1.amazonaws.com/noaa_viirs_nightlights/release/v1/2024/tiles_values/{z}/{x}/{y}.png
      download:
        cog_url: https://geo-test-api.s3.us-east-1.amazonaws.com/noaa_viirs_nightlights/release/v1/2024/poa_nightlights_cog.tif
      metadata:
