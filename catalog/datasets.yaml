    description: >
      OEF landslide susceptibility index (0–1) for Porto Alegre on a 90 m grid.
      Ensemble of Copernicus GLO-30 slope, CHIRPS R90p climatology, SoilGrids clay %,
      MODIS NDVI P10 (DJF 2015–2024), and MERIT Hydro HAND, with Dynamic World land cover modifier.
      Slope < 15° gates all components to zero. Methodology in
